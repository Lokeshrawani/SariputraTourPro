# ==========================================
# Sariputra Tour & Holidays - Spring Boot Config
# ==========================================

# Server & Port Configuration
server.port=${PORT:8080}
server.shutdown=graceful

# Response Compression (Gzip) for Better Performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Application Information
spring.application.name=tour-api

# Jackson & JSON Serialization Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sariputra.tour=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
