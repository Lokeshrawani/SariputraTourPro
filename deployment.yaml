apiVersion: apps/v1
kind: Deployment
metadata:
  name: sariputra-tour-pro
  labels:
    app: sariputra-tour-pro

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: sariputra-tour-pro

  template:
    metadata:
      labels:
        app: sariputra-tour-pro

    spec:
      containers:
        - name: tour-pro
          image: lokeshkumarrawani/sariputra-tour-pro:v1.1.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: sariputra-tour-pro-config
            - secretRef:
                name: sariputra-tour-pro-secret

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: sariputra-tour-pro-service
  labels:
    app: sariputra-tour-pro

spec:
  type: NodePort

  selector:
    app: sariputra-tour-pro

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080